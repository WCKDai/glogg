# glogg on Coolify (https://coolify.io), with HTTPS and a password, in a few clicks:
#
#   1. New Resource → your Git repository (this one, or your fork).
#   2. Build Pack: Docker Compose. Docker Compose Location: /docker-compose.coolify.yml
#   3. Deploy. Coolify gives glogg a domain with HTTPS (change it under the glogg service)
#      and generates its password: Environment Variables → SERVICE_PASSWORD_GLOGG.
#
# Nothing is published on the server's ports: only Coolify's proxy reaches glogg, over
# HTTPS, and every request needs a session from that password. SearXNG runs privately
# next to glogg for web results.

services:
  glogg:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Coolify: give glogg a domain and route it to port 4173.
      - SERVICE_FQDN_GLOGG_4173
      # A password Coolify generates and keeps; every page and API call needs it.
      - GLOGG_PASSWORD=${SERVICE_PASSWORD_GLOGG}
      # Answer only under glogg's own domain.
      - GLOGG_ALLOWED_HOSTS=${SERVICE_FQDN_GLOGG}
      # Only Coolify's proxy reaches glogg (no published port), so believe the address it forwards.
      - GLOGG_TRUST_PROXY=uniquelocal
      - SEARXNG_URL=http://searxng:8080
      # Optional, in Coolify's environment variables (Settings → Keys in glogg works too, and wins).
      - GLOGG_ALLOWED_ORIGINS=${GLOGG_ALLOWED_ORIGINS:-}
      - TORZNAB_URL=${TORZNAB_URL:-}
      - TORZNAB_API_KEY=${TORZNAB_API_KEY:-}
      - NEWZNAB_URL=${NEWZNAB_URL:-}
      - NEWZNAB_API_KEY=${NEWZNAB_API_KEY:-}
      - NZBLIFE_URL=${NZBLIFE_URL:-}
      - NZBLIFE_API_KEY=${NZBLIFE_API_KEY:-}
      - MARGINALIA_API_KEY=${MARGINALIA_API_KEY:-}
      - STACKEXCHANGE_KEY=${STACKEXCHANGE_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - GLOGG_MAX_SEARCHES=${GLOGG_MAX_SEARCHES:-32}
      - GLOGG_MAX_API_REQUESTS=${GLOGG_MAX_API_REQUESTS:-64}
      - GLOGG_MAX_FAVICONS=${GLOGG_MAX_FAVICONS:-32}
      - GLOGG_MAX_READERS=${GLOGG_MAX_READERS:-16}
      - GLOGG_SHUTDOWN_MS=${GLOGG_SHUTDOWN_MS:-15000}
    volumes:
      - glogg-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      - searxng

  searxng:
    build:
      context: infra/searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SERVICE_PASSWORD_64_SEARXNG}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  glogg-data:

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      # Built first: the browser tests and the asset tests run against the build.
      - name: Build web app & browser extension
        run: npm run build
      # The speed budgets time real code, so they run uninstrumented; coverage leaves that suite out.
      - name: Run unit tests
        run: npm test
      - name: Check coverage
        run: npm run test:coverage
      - name: Run browser tests (headless Chrome)
        run: npm run test:e2e
      - name: Check bundle size
        run: npm run check:bundle

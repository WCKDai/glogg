name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ghcr:
    name: multi-arch ghcr image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Resolve tag & version
        id: meta
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          tag="${RAW_TAG}"
          version="${tag#v}"
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU & Buildx
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name glogg-multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build & push multi-arch image (linux/amd64, linux/arm64)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "${PRERELEASE}" != "true" ] && [[ "${VERSION}" != *-* ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.title=glogg" \
            --label "org.opencontainers.image.description=Self-hosted anti-slop meta-search engine, SQLite FTS5 small-web & forum deep index, and clean reader" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${tags[@]}" \
            --push \
            .

  extension:
    name: browser extension asset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: meta
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build Manifest V3 extension ZIP
        run: |
          npm ci
          npm run build:extension

      - name: Attach extension ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "${TAG}" dist-extension/glogg-extension-v*.zip --clobber

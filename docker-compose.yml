# glogg with Docker Compose.
#
#   docker compose up -d                       open http://localhost:4173
#   docker compose --profile searxng up -d     also run a private SearXNG for web results
#
# Settings, keys and the deep index live in the glogg-data volume. glogg answers on
# this machine only; to reach it from other devices see "Docker" in the README
# (set GLOGG_PASSWORD first). Optional settings go in a .env file (see .env.example).

name: glogg

services:
  glogg:
    build: .
    image: glogg:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${GLOGG_PORT:-4173}:4173"
    # What .env sets (see .env.example). Where glogg listens and keeps its data is the image's to set.
    environment:
      GLOGG_PASSWORD: ${GLOGG_PASSWORD:-}
      GLOGG_PASSWORD_FILE: ${GLOGG_PASSWORD_FILE:-}
      GLOGG_ALLOWED_HOSTS: ${GLOGG_ALLOWED_HOSTS:-}
      GLOGG_ALLOWED_ORIGINS: ${GLOGG_ALLOWED_ORIGINS:-}
      GLOGG_ALLOW_PRIVATE_FETCH: ${GLOGG_ALLOW_PRIVATE_FETCH:-}
      # Only this machine reaches the port, so believe the client address a local proxy forwards.
      # If you publish the port to your network instead, set GLOGG_TRUST_PROXY=loopback.
      GLOGG_TRUST_PROXY: ${GLOGG_TRUST_PROXY:-uniquelocal}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      BITMAGNET_URL: ${BITMAGNET_URL:-}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-}
      TORZNAB_URL: ${TORZNAB_URL:-}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}
      NEWZNAB_URL: ${NEWZNAB_URL:-}
      NEWZNAB_API_KEY: ${NEWZNAB_API_KEY:-}
      NZBLIFE_URL: ${NZBLIFE_URL:-}
      NZBLIFE_API_KEY: ${NZBLIFE_API_KEY:-}
      MARGINALIA_API_KEY: ${MARGINALIA_API_KEY:-}
      STACKEXCHANGE_KEY: ${STACKEXCHANGE_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      GLOGG_HAPPY_EYEBALLS: ${GLOGG_HAPPY_EYEBALLS:-}
      GLOGG_CORE_GRACE_MS: ${GLOGG_CORE_GRACE_MS:-}
      GLOGG_MIN_WAIT_MS: ${GLOGG_MIN_WAIT_MS:-}
      GLOGG_SOURCE_DEADLINE_MS: ${GLOGG_SOURCE_DEADLINE_MS:-}
      GLOGG_HARD_DEADLINE_MS: ${GLOGG_HARD_DEADLINE_MS:-}
      GLOGG_ANSWER_BUDGET_MS: ${GLOGG_ANSWER_BUDGET_MS:-}
      GLOGG_CACHE_TTL_MS: ${GLOGG_CACHE_TTL_MS:-}
      GLOGG_SOURCE_REST_MS: ${GLOGG_SOURCE_REST_MS:-}
      GLOGG_TOOL_TIMEOUT_MS: ${GLOGG_TOOL_TIMEOUT_MS:-}
      GLOGG_MODE: ${GLOGG_MODE:-private}
      GLOGG_MAX_SEARCHES: ${GLOGG_MAX_SEARCHES:-32}
      GLOGG_MAX_API_REQUESTS: ${GLOGG_MAX_API_REQUESTS:-64}
      GLOGG_MAX_FAVICONS: ${GLOGG_MAX_FAVICONS:-32}
      GLOGG_MAX_READERS: ${GLOGG_MAX_READERS:-16}
      GLOGG_SHUTDOWN_MS: ${GLOGG_SHUTDOWN_MS:-15000}
      GLOGG_PUBLIC_OPENLIBRARY: ${GLOGG_PUBLIC_OPENLIBRARY:-0}
    volumes:
      - glogg-data:/data
    # Nothing but /data (and a scratch /tmp) is writable, and the process can't gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  searxng:
    profiles: [searxng]
    build: ./infra/searxng
    image: glogg-searxng:local
    restart: unless-stopped
    # No published port: only glogg talks to it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  glogg-data:

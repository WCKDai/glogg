# Include inside nginx's http {} context. Replace the hostname/certificate paths.
# Starting policy only: tune from on-host measurements and your traffic mix.
limit_req_zone $binary_remote_addr zone=glogg_visitors:10m rate=5r/s;
limit_req_zone $server_name zone=glogg_total:1m rate=120r/s;
limit_conn_zone $binary_remote_addr zone=glogg_connections:10m;

server {
    listen 80;
    server_name glogg.example.com;
    return 301 https://glogg.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name glogg.example.com;
    ssl_certificate /etc/letsencrypt/live/glogg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glogg.example.com/privkey.pem;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    # Searches can contain private text. Keep request URLs out of access logs.
    access_log off;

    location / {
        limit_req zone=glogg_visitors burst=20 nodelay;
        limit_req zone=glogg_total burst=120 nodelay;
        limit_conn glogg_connections 20;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # This example is the internet-facing edge: overwrite untrusted client headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }
}

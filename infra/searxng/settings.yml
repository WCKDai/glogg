use_default_settings: true

general:
  instance_name: "glogg // SearXNG Meta-Node"
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json
    - csv
    - rss

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "glogg-local-searxng-unslop-secret-key"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 2.4
  max_request_timeout: 4.0

# Enable web engines that answer cleanly from server/datacenter IPs and disable
# HTML scrapers that routinely return CAPTCHAs, rate-limit suspensions or timeouts.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: wikidata
    disabled: true
  - name: brave.news
    disabled: true
  - name: google news
    disabled: true
  - name: reuters
    disabled: true
